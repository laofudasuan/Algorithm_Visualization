<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 屋顶（茅草质感，暖棕色） -->
  <path d="M12 22 L24 8 L36 22 Z" fill="#D4A373" />
  <path d="M14 22 L24 12 L34 22 Z" fill="#BB875D" opacity="0.5" /> <!-- 茅草层次感 -->
  <!-- 屋身（原木色，圆角更萌） -->
  <rect x="14" y="22" width="20" height="18" rx="3" fill="#946B48" />
  <!-- 房门（深木色） -->
  <rect x="21" y="32" width="6" height="8" rx="1" fill="#6B4A33" />
  <!-- 小窗户（暖黄色灯光感） -->
  <circle cx="19" cy="28" r="2" fill="#FDE68A" />
  <circle cx="29" cy="28" r="2" fill="#FDE68A" />
  <!-- 小烟囱（简约方形） -->
  <rect x="28" y="14" width="3" height="6" fill="#BB875D" />
  <rect x="27" y="12" width="5" height="2" fill="#D4A373" /> <!-- 烟囱顶 -->
</svg>
